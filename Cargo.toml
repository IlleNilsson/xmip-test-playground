# Its own workspace root, so this repository builds on its own.
#
# Every module repository carries this and the template did not, which stopped
# mattering the moment the template stopped sitting beside the estate: nested at
# template/rust, cargo walked up, found the root workspace and refused to build.
#
# It would have bitten a generated repository the same way. A template that does
# not obey the estate's rules produces repositories that start out breaking
# them — docs/governance/rust-style.md section 4.
[workspace]

[package]
name = "xmip-test-playground"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-test-playground"
description = "The Xmip Playground: spawns Development nodes as processes and exercises every transport and content contract through them, continuously."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The transports it ping-pongs over, and the snapshot it publishes verdicts
# into. observe carries Health; transport carries the Transport trait whose
# send/receive is the round trip.
observe = { package = "xmip-core-observe", git = "https://github.com/IlleNilsson/xmip-core-observe", branch = "main" }
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }

# The content axis: a probe sends an actual Stream, and on arrival a real
# Contract validates it — a pair is delivered only if it round-tripped and the
# contract held. stream carries the immutable content, core the StreamId,
# contract the Contract trait the playground's validators implement.
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }

# The identity axis: a Receive Location identifies, authenticates and authorizes;
# a Send Location presents identity (ADR-0019, ADR-0033). The playground drives
# the estate's real gates with stand-in implementors, so a fault is a real
# Refusal or Decision::Denied, not a fabricated string. context carries the
# AuthenticatedIdentity and IdentityFacts the gates pass between them.
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main" }
authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }

# The retention and archiving axis: the methodical-secretary scenario drives the
# real retention policy (keep, archive, delete by age) and the real archive store
# over a logical clock, so an item's lifecycle is exercised, not mocked.
retain = { package = "xmip-core-retain", git = "https://github.com/IlleNilsson/xmip-core-retain", branch = "main" }
archive = { package = "xmip-core-archive", git = "https://github.com/IlleNilsson/xmip-core-archive", branch = "main" }

# The one real parser the content contracts lean on. JSON well-formedness is a
# genuine check, not a byte comparison, which is the point of exercising a
# contract rather than a transport — JSON as content, which is exactly the case
# the estate keeps for it.
serde_json = "1"

# The snapshot and history files are written in TOML: on disk is TOML across the
# estate, JSON is reserved for memory and the wire (the owner's rule). serde
# derives the shapes; toml serialises them.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. docs/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
