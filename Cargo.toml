# Its own workspace root, so this repository builds on its own.
#
# Every module repository carries this and the template did not, which stopped
# mattering the moment the template stopped sitting beside the estate: nested at
# template/rust, cargo walked up, found the root workspace and refused to build.
#
# It would have bitten a generated repository the same way. A template that does
# not obey the estate's rules produces repositories that start out breaking
# them — docs/governance/rust-style.md section 4.
[workspace]

[package]
name = "xmip-test-playground"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-test-playground"
description = "The Xmip Playground: spawns Development nodes as processes and exercises every transport and content contract through them, continuously."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The transports it ping-pongs over, and the snapshot it publishes verdicts
# into. observe carries Health; transport carries the Transport trait whose
# send/receive is the round trip.
observe = { package = "xmip-core-observe", git = "https://github.com/IlleNilsson/xmip-core-observe", branch = "main" }
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }

# One technology repository per protocol (ADR-0010), each mounted under the
# transport capability. The pingpong adapters drive these.
transport_file = { package = "xmip-core-transport-file", git = "https://github.com/IlleNilsson/xmip-core-transport-file", branch = "main" }
transport_tcp = { package = "xmip-core-transport-tcp", git = "https://github.com/IlleNilsson/xmip-core-transport-tcp", branch = "main" }
transport_udp = { package = "xmip-core-transport-udp", git = "https://github.com/IlleNilsson/xmip-core-transport-udp", branch = "main" }
transport_http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
transport_smtp = { package = "xmip-core-transport-smtp", git = "https://github.com/IlleNilsson/xmip-core-transport-smtp", branch = "main" }
transport_websocket = { package = "xmip-core-transport-websocket", git = "https://github.com/IlleNilsson/xmip-core-transport-websocket", branch = "main" }
transport_mllp = { package = "xmip-core-transport-mllp", git = "https://github.com/IlleNilsson/xmip-core-transport-mllp", branch = "main" }
transport_modbus = { package = "xmip-core-transport-modbus", git = "https://github.com/IlleNilsson/xmip-core-transport-modbus", branch = "main" }
transport_bacnet = { package = "xmip-core-transport-bacnet", git = "https://github.com/IlleNilsson/xmip-core-transport-bacnet", branch = "main" }
transport_serial = { package = "xmip-core-transport-serial", git = "https://github.com/IlleNilsson/xmip-core-transport-serial", branch = "main", default-features = false }
transport_can_bus = { package = "xmip-core-transport-can-bus", git = "https://github.com/IlleNilsson/xmip-core-transport-can-bus", branch = "main" }
transport_mqtt = { package = "xmip-core-transport-mqtt", git = "https://github.com/IlleNilsson/xmip-core-transport-mqtt", branch = "main" }
transport_nats = { package = "xmip-core-transport-nats", git = "https://github.com/IlleNilsson/xmip-core-transport-nats", branch = "main" }
transport_syslog = { package = "xmip-core-transport-syslog", git = "https://github.com/IlleNilsson/xmip-core-transport-syslog", branch = "main" }
transport_coap = { package = "xmip-core-transport-coap", git = "https://github.com/IlleNilsson/xmip-core-transport-coap", branch = "main" }
transport_dns = { package = "xmip-core-transport-dns", git = "https://github.com/IlleNilsson/xmip-core-transport-dns", branch = "main" }
transport_amqp = { package = "xmip-core-transport-amqp", git = "https://github.com/IlleNilsson/xmip-core-transport-amqp", branch = "main" }
transport_dnp3 = { package = "xmip-core-transport-dnp3", git = "https://github.com/IlleNilsson/xmip-core-transport-dnp3", branch = "main" }
transport_kafka = { package = "xmip-core-transport-kafka", git = "https://github.com/IlleNilsson/xmip-core-transport-kafka", branch = "main" }
transport_iec_60870_5_104 = { package = "xmip-core-transport-iec-60870-5-104", git = "https://github.com/IlleNilsson/xmip-core-transport-iec-60870-5-104", branch = "main" }
transport_imap = { package = "xmip-core-transport-imap", git = "https://github.com/IlleNilsson/xmip-core-transport-imap", branch = "main" }
transport_redis_streams = { package = "xmip-core-transport-redis-streams", git = "https://github.com/IlleNilsson/xmip-core-transport-redis-streams", branch = "main" }
transport_pop3 = { package = "xmip-core-transport-pop3", git = "https://github.com/IlleNilsson/xmip-core-transport-pop3", branch = "main" }
transport_ftp = { package = "xmip-core-transport-ftp", git = "https://github.com/IlleNilsson/xmip-core-transport-ftp", branch = "main" }

# The content axis: a probe sends an actual Stream, and on arrival a real
# Contract validates it — a pair is delivered only if it round-tripped and the
# contract held. stream carries the immutable content, core the StreamId,
# contract the Contract trait the playground's validators implement.
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }

# The identity axis: a Receive Location identifies, authenticates and authorizes;
# a Send Location presents identity (ADR-0019, ADR-0033). The playground drives
# the estate's real gates with stand-in implementors, so a fault is a real
# Refusal or Decision::Denied, not a fabricated string. context carries the
# AuthenticatedIdentity and IdentityFacts the gates pass between them.
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main" }
authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }

# The retention and archiving axis: the methodical-secretary scenario drives the
# real retention policy (keep, archive, delete by age) and the real archive store
# over a logical clock, so an item's lifecycle is exercised, not mocked.
retain = { package = "xmip-core-retain", git = "https://github.com/IlleNilsson/xmip-core-retain", branch = "main" }
archive = { package = "xmip-core-archive", git = "https://github.com/IlleNilsson/xmip-core-archive", branch = "main" }

# The content technologies the probes validate through, so a pair is delivered
# only if the estate's own contract held — not a stand-in parser in the
# playground. One repository per contract type (ADR-0010).
contract_json_schema = { package = "xmip-core-contract-json-schema", git = "https://github.com/IlleNilsson/xmip-core-contract-json-schema", branch = "main" }
contract_xml_schema = { package = "xmip-core-contract-xml-schema", git = "https://github.com/IlleNilsson/xmip-core-contract-xml-schema", branch = "main" }
contract_csv = { package = "xmip-core-contract-csv", git = "https://github.com/IlleNilsson/xmip-core-contract-csv", branch = "main" }
contract_fixed_width = { package = "xmip-core-contract-fixed-width", git = "https://github.com/IlleNilsson/xmip-core-contract-fixed-width", branch = "main" }
contract_edi_edifact = { package = "xmip-core-contract-edi-edifact", git = "https://github.com/IlleNilsson/xmip-core-contract-edi-edifact", branch = "main" }
contract_regex = { package = "xmip-core-contract-regex", git = "https://github.com/IlleNilsson/xmip-core-contract-regex", branch = "main" }
contract_schematron = { package = "xmip-core-contract-schematron", git = "https://github.com/IlleNilsson/xmip-core-contract-schematron", branch = "main" }
contract_hl7_v2 = { package = "xmip-core-contract-hl7-v2", git = "https://github.com/IlleNilsson/xmip-core-contract-hl7-v2", branch = "main" }
contract_fhir = { package = "xmip-core-contract-fhir", git = "https://github.com/IlleNilsson/xmip-core-contract-fhir", branch = "main" }
contract_edi_x12 = { package = "xmip-core-contract-edi-x12", git = "https://github.com/IlleNilsson/xmip-core-contract-edi-x12", branch = "main" }
contract_avro = { package = "xmip-core-contract-avro", git = "https://github.com/IlleNilsson/xmip-core-contract-avro", branch = "main" }
contract_protobuf = { package = "xmip-core-contract-protobuf", git = "https://github.com/IlleNilsson/xmip-core-contract-protobuf", branch = "main" }
contract_asyncapi = { package = "xmip-core-contract-asyncapi", git = "https://github.com/IlleNilsson/xmip-core-contract-asyncapi", branch = "main" }
contract_openapi = { package = "xmip-core-contract-openapi", git = "https://github.com/IlleNilsson/xmip-core-contract-openapi", branch = "main" }
contract_wsdl = { package = "xmip-core-contract-wsdl", git = "https://github.com/IlleNilsson/xmip-core-contract-wsdl", branch = "main" }
contract_graphql_schema = { package = "xmip-core-contract-graphql-schema", git = "https://github.com/IlleNilsson/xmip-core-contract-graphql-schema", branch = "main" }

# The snapshot and history files are written in TOML: on disk is TOML across the
# estate, JSON is reserved for memory and the wire (the owner's rule). serde
# derives the shapes; toml serialises them.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. docs/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
